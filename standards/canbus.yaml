name: CAN bus
description: |
  A controller area network (CAN) is a vehicle bus standard designed to enable efficient communication primarily between 
  electronic control units (ECUs). Originally developed to reduce the complexity and cost of electrical wiring in 
  automobiles through multiplexing, the CAN bus protocol has since been adopted in various other contexts. 
  
  This broadcast-based, message-oriented protocol ensures data integrity and prioritization through a process called 
  arbitration, allowing the highest priority device to continue transmitting if multiple devices attempt to send data 
  simultaneously, while others back off. Its reliability is enhanced by differential signaling, which mitigates 
  electrical noise. 
  
  Common versions of the CAN protocol include CAN 2.0, CAN FD, and CAN XL which vary in their data rate capabilities 
  and maximum data payload sizes.
