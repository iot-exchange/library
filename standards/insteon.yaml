name: Insteon
description: |
  Insteon is a proprietary home automation (domotics) system that enables light switches, lights, leak sensors, 
  remote controls, motion sensors, and other electrically powered devices to interoperate through power lines, 
  radio frequency (RF) communications, or both.
  It employs a dual-mesh networking topology in which all devices are peers and each device independently transmits, 
  receives, confirm and repeats messages.
  Like other home automation systems, it had been associated with the Internet of things.
